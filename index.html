<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NSWPF Employee Database</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5fa;--surface:#fff;--ink:#0d1a33;--muted:#566684;--line:#d6deec;--navy:#0a2a5e;--blue:#1d6fd6;--chip:#e6eefb;--chip-on:#0a2a5e;--chip-on-ink:#fff;--hover:#f3f7fd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08101f;--surface:#101a33;--ink:#e7edf8;--muted:#8fa0c0;--line:#22335a;--blue:#5aa2ff;--chip:#17264a;--chip-on:#5aa2ff;--chip-on-ink:#08101f;--hover:#15213f}}
:root[data-theme="dark"]{--bg:#08101f;--surface:#101a33;--ink:#e7edf8;--muted:#8fa0c0;--line:#22335a;--blue:#5aa2ff;--chip:#17264a;--chip-on:#5aa2ff;--chip-on-ink:#08101f;--hover:#15213f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,Arial,sans-serif}
.check{height:28px;background:repeating-conic-gradient(#1d6fd6 0 25%,#fff 0 50%) 0 0/28px 28px}
header{background:var(--navy);color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding:32px 20px 28px}
h1{font:700 clamp(2.2rem,6.5vw,3.8rem)/.95 "Barlow Condensed",Impact,sans-serif;margin:0}
.sub{margin:8px 0 0;color:#b9c8e6;max-width:46ch}
.logo{height:clamp(110px,18vw,170px);width:auto}.stats{display:flex;gap:24px}.stat b{display:block;font:700 2.2rem/1 "Barlow Condensed",sans-serif}.stat span{color:#b9c8e6;font-size:.9rem}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 0 12px}
.row1{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-height:44px}
input[type=search]{flex:1 1 260px}select{flex:0 1 200px}
label.chk{display:flex;gap:6px;align-items:center;min-height:44px}
button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--chip);color:var(--ink);border:0;border-radius:999px;padding:6px 14px;font-weight:500;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--chip-on);color:var(--chip-on-ink)}
.themebtn{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:0 14px;min-height:44px}
main{padding:22px 20px 60px}.group{margin-bottom:26px}
.group h2{display:flex;align-items:baseline;gap:10px;margin:0 0 8px;font:700 1.6rem/1.1 "Barlow Condensed",sans-serif;padding-left:12px;border-left:6px solid var(--blue)}
.group h2 small{font:500 .9rem Barlow,sans-serif;color:var(--muted)}
.table{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.head,.m{display:grid;grid-template-columns:80px 1.4fr 1.4fr 1.6fr 1.5fr;gap:12px;align-items:center;padding:11px 16px}
.head{color:var(--muted);font-size:.85rem;font-weight:600;border-bottom:1px solid var(--line)}
.m{border-bottom:1px solid var(--line)}.m:last-child{border-bottom:0}.m:hover{background:var(--hover)}
.cs{font:600 1.45rem/1 Teko,"Barlow Condensed",Impact,sans-serif;color:var(--blue);letter-spacing:.05em}
.copy{background:none;border:1px dashed var(--line);color:var(--ink);border-radius:6px;padding:3px 8px;max-width:100%;overflow-wrap:anywhere;text-align:left}
.copy:hover{border-color:var(--blue);color:var(--blue)}
.none{color:var(--muted)}
.pill{display:inline-block;border-radius:4px;padding:3px 10px;font-size:.85rem;font-weight:600;margin:1px 4px 1px 0}
.lbl{display:none;color:var(--muted);font-size:.8rem}
.empty{text-align:center;padding:50px 10px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
footer{color:var(--muted);font-size:.85rem;padding:0 20px 40px;text-align:center}
@media (max-width:820px){.head{display:none}.m{grid-template-columns:1fr 1fr}.cs{grid-column:1/-1}.lbl{display:block}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
input.f,select.f{font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-height:36px;margin:1px 0}
select.f{font-weight:600}
.role{color:var(--muted);font-size:.92rem}
.rm{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;font-size:.8rem}
.rm[data-armed]{border-color:#c4161c;color:#c4161c}
.banner{background:var(--chip);border-left:6px solid var(--blue);border-radius:6px;padding:12px 16px;margin-bottom:20px}
.banner.off{border-color:var(--muted)}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.add input,.add select{min-height:40px}
.add button{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:0 16px;min-height:40px}
.head.e,.m.e{grid-template-columns:80px 1.2fr 1.2fr 1.6fr 1.7fr 70px}
.head.nc,.m.nc{grid-template-columns:80px 1.4fr 1.4fr 1.6fr}
.head.e.nc,.m.e.nc{grid-template-columns:80px 1.2fr 1.2fr 1.6fr 70px}
a.themebtn{display:inline-flex;align-items:center;text-decoration:none}
@media (max-width:820px){.m.e,.m.nc,.m.e.nc{grid-template-columns:1fr 1fr}}
.pages{background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.pages .wrap{display:flex;gap:8px;padding-top:10px;padding-bottom:10px;width:max-content;min-width:100%}
.pages a{white-space:nowrap;padding:7px 14px;border-radius:999px;background:var(--chip);color:var(--ink);text-decoration:none;font-weight:500;font-size:.92rem}
.pages a[aria-current=page]{background:var(--chip-on);color:var(--chip-on-ink)}
.chips[hidden]{display:none}
</style>
</head>

  <div class="check" aria-hidden="true"></div>

function setup(){
  $("rank").innerHTML='<option value="All">All ranks</option>'+RANKS.map(r=>`<option>${esc(r)}</option>`).join("");
  $("chips").innerHTML=["All",...FILTER_DIVS].map(d=>`<button type="button" class="chip" data-d="${esc(d)}" aria-pressed="${d==="All"}">${d==="All"?"All divisions":esc(d)}</button>`).join("");
  $("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;activeDiv=b.dataset.d;document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));render()});
  ["q","hide"].forEach(i=>$(i).addEventListener("input",render));$("rank").addEventListener("change",render);
  const L=$("list");
  L.addEventListener("click",e=>{
    const b=e.target.closest(".copy");if(b)return copy(b.dataset.v);
    const r=e.target.closest(".rm");if(!r)return;
    if(!r.dataset.armed){r.dataset.armed=1;r.textContent="Sure?";return}
    ROSTER=ROSTER.filter(m=>m.callsign!==r.dataset.c);save();render();
  });
  L.addEventListener("change",e=>{
    const t=e.target;if(!edit||!t.dataset.f)return;
    const m=ROSTER.find(x=>x.callsign===t.dataset.c);if(!m)return;
    if(t.dataset.f==="sec")m.secondary[+t.dataset.k]=t.value;else m[t.dataset.f]=t.value.trim();
    if(t.tagName==="SELECT")t.setAttribute("style",dstyle(t.value)+(t.dataset.f==="sec"&&t.value==="None"?";background:var(--surface);color:var(--ink)":""));
    stats();save();
  });
  $("theme").addEventListener("click",()=>{const r=document.documentElement;const d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=d?"light":"dark"});
}
let st;function save(){if(!dbDoc)return;clearTimeout(st);st=setTimeout(()=>dbDoc.set({members:ROSTER}).then(()=>toast("Saved"),()=>toast("Could not save")),600)}
function row(m){
  if(!edit){
    const sec=m.secondary.filter(d=>d&&d!=="None");
    const last=sec.length?sec.map(pill).join(" "):'<span class="none">None</span>';
    return`<div class="m${isCmd(m)?" nc":""}"><div class="cs">${esc(page&&m.dcs?m.dcs:m.callsign)}</div>
      <div><span class="lbl">Discord username</span>${user(m.discord,"Discord")}</div>
      <div><span class="lbl">Roblox username</span>${user(m.roblox,"Roblox")}</div>
      <div><span class="lbl">Primary division</span>${pill(m.primary)}</div>
      ${isCmd(m)?"":`<div><span class="lbl">Secondary divisions</span>${last}</div>`}</div>`;
  }
  const c=esc(m.callsign),inp=(f,v,ph)=>`<input class="f" data-f="${f}" data-c="${c}" value="${esc(v)}" placeholder="${ph}" aria-label="${f} for ${c}">`;
  const sel=(k,v)=>`<select class="f" data-f="sec" data-k="${k}" data-c="${c}" aria-label="Secondary division ${k+1} for ${c}" style="${v==="None"?"":dstyle(v)}">${opts(FILTER_DIVS,v,true)}</select>`;
  return`<div class="m e${isCmd(m)?" nc":""}"><div class="cs">${esc(page&&m.dcs?m.dcs:m.callsign)}</div><div>${inp("discord",m.discord,"Discord username")}</div><div>${inp("roblox",m.roblox,"Roblox username")}</div>
    <div><select class="f" data-f="primary" data-c="${c}" aria-label="Primary division for ${c}" style="${dstyle(m.primary)}">${opts(divsFor(m.rank),m.primary)}</select></div>
    ${isCmd(m)?"":`<div>${sel(0,m.secondary[0])+sel(1,m.secondary[1])}</div>`}
    <div><button type="button" class="rm" data-c="${c}">Remove</button></div></div>`;
}
function render(){
  const q=$("q").value.trim().toLowerCase(),rk=$("rank").value,hide=$("hide").checked,out=[];
  RANKS.forEach(rank=>{
    if(rk!=="All"&&rk!==rank)return;
    const ms=ROSTER.filter(m=>m.rank===rank&&(activeDiv==="All"||m.primary===activeDiv||m.secondary.includes(activeDiv))&&(!hide||m.discord||m.roblox)&&(!q||[m.callsign,m.dcs||"",m.discord,m.roblox].some(v=>v.toLowerCase().includes(q))));
    if(!ms.length){if(!q&&activeDiv==="All"&&!hide)out.push(`<section class="group"><h2>${esc(rank)}</h2><div class="table"><div class="empty" style="padding:18px">No members added yet.</div></div></section>`);return}
    out.push(`<section class="group"><h2>${esc(rank)}</h2><div class="table">
    <div class="head${edit?" e":""}${COMMAND.includes(rank)?" nc":""}"><span>Callsign</span><span>Discord username</span><span>Roblox username</span><span>Primary division</span>${COMMAND.includes(rank)?"":"<span>Secondary divisions</span>"}${edit?"<span></span>":""}</div>
    ${ms.map(row).join("")}</div></section>`);
  });
  $("list").innerHTML=(out.join("")||'<div class="empty">${page&&!q&&!hide&&rk==="All"?"No members have been assigned to this division yet.":"No positions match. Clear the search or pick another rank or division."}</div>');
}
function addPos(){
  const cs=$("nc").value.trim().toUpperCase();
  if(!cs||ROSTER.some(m=>m.callsign===cs))return toast(cs?"That callsign already exists":"Enter a callsign");
  ROSTER.push(P(cs,$("nr").value,$("nd").value));ROSTER.sort((a,b)=>RANKS.indexOf(a.rank)-RANKS.indexOf(b.rank)||a.callsign.localeCompare(b.callsign,undefined,{numeric:true}));
  $("nc").value="";save();stats();render();
}
async function initEditor(){
  try{
    if(!window.claude||!claude.use)throw 0;
    const [db,u]=await Promise.all([claude.use("db"),claude.use("user")]);
    const ok=db&&u&&((await u.isOwner())||(await u.canEdit()));
    if(!ok)throw 0;
    dbDoc=db.doc("roster/main");
    const s=await dbDoc.get();
    if(s.exists&&Array.isArray(s.data().members))ROSTER=s.data().members;else await dbDoc.set({members:ROSTER});
    edit=true;
    $("banner").innerHTML=`<strong>Editing mode.</strong> Changes save automatically. When you are happy, ask Claude to update the public page with the latest roster.
      <div class="add"><input id="nc" placeholder="New callsign, e.g. SC11" aria-label="New callsign"><select id="nr" aria-label="Rank">${opts(RANKS,"Inspector")}</select><select id="nd" aria-label="Primary division">${opts(ALLDIVS,"General Duties")}</select><button type="button" id="na">Add position</button></div>`;
    $("na").addEventListener("click",addPos);
    stats();render();
  }catch(e){$("banner").innerHTML="<strong>View only.</strong> Open this page while signed in as the owner to edit the roster.";$("banner").classList.add("off")}
}
const slug=d=>d.toLowerCase().replace(/&/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const HOME_SUB="Callsigns, ranks, appointments and contact usernames for every position in the New South Wales Police Force.";
let page=null;
function buildNav(){$("pages").innerHTML='<div class="wrap">'+[["all","All divisions"],...DIVPAGES.map(d=>[slug(d),d])].map(([k,t])=>`<a href="#${k}" data-s="${k}">${esc(t)}</a>`).join("")+"</div>"}
function route(){
  const h=location.hash.slice(1);
  page=DIVPAGES.find(d=>slug(d)===h)||null;
  activeDiv=page||"All";
  $("rank").value="All";$("q").value="";$("hide").checked=false;
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(!page&&c.dataset.d==="All")));
  $("chips").hidden=true;
  $("h1").textContent=page||"NSWPF Employee Database";
  $("sub").textContent=page?"Division roster. Everyone listed has "+page+" as a primary or secondary division.":HOME_SUB;
  document.title=(page?page+" | ":"")+"NSWPF Employee Database";
  document.querySelectorAll("#pages a").forEach(a=>{if(a.dataset.s===(page?slug(page):"all"))a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  render();scrollTo(0,0);
}
setup();buildNav();addEventListener("hashchange",route);route();
if(EDITOR){const b=document.createElement("div");b.className="banner off";b.id="banner";b.textContent="Loading editor…";$("list").before(b);initEditor()}
</script>
</body>
</html>
